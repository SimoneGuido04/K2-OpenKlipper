# Offline checks on every push and pull request: the unit tests and a
# byte-compile of everything Python (CONTRIBUTING.md, step 5). Live hardware
# testing stays separate.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The code needs nothing newer than 3.8 (vermin); 3.9 guards that,
        # 3.12 catches breakage on a current Python
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        # cffi builds Klipper's chelper for the motion tests; pillow is
        # the touchscreen's; jinja2 renders the macros under test
        run: python -m pip install cffi pillow jinja2 numpy
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile
        run: python -m compileall -q klippy harkscreen harkcam host tools system
